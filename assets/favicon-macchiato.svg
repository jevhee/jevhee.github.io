<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient: Catppuccin Macchiato Base to Mantle -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24273a"/>
      <stop offset="50%" stop-color="#1e2030"/>
      <stop offset="100%" stop-color="#181926"/>
    </linearGradient>

    <!-- Accent Gradient: Catppuccin Macchiato Blue (#8aadf4) to Sapphire/Teal (#8bd5ca) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8aadf4"/>
      <stop offset="60%" stop-color="#7dc4e4"/>
      <stop offset="100%" stop-color="#8bd5ca"/>
    </linearGradient>

    <!-- Subtle Glow / Surface Gradient -->
    <radialGradient id="glowGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8aadf4" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#8aadf4" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#24273a" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8aadf4" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#7dc4e4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#363a4f" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  <!-- Ambient Top Glow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#glowGrad)"/>
  <!-- Subtle Border stroke -->
  <rect x="24" y="24" width="464" height="464" rx="112" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Inner Subtle Dot Grid Matrix (subtle developer aesthetic) -->
  <g fill="#363a4f" opacity="0.65">
    <circle cx="96" cy="96" r="3"/>
    <circle cx="128" cy="96" r="3"/>
    <circle cx="384" cy="96" r="3"/>
    <circle cx="416" cy="96" r="3"/>
    <circle cx="96" cy="416" r="3"/>
    <circle cx="128" cy="416" r="3"/>
    <circle cx="384" cy="416" r="3"/>
    <circle cx="416" cy="416" r="3"/>
  </g>

  <!-- Mobile Developer Brand Emblem: Clean Geometrical JS Monogram merged with modern Mobile Device Frame & Code Bracket accents -->
  <g transform="translate(4, 4)">
    <!-- Sleek Stylized Phone / Architecture Notch Indicator -->
    <rect x="216" y="86" width="72" height="6" rx="3" fill="#8aadf4" fill-opacity="0.3"/>
    <circle cx="304" cy="89" r="4" fill="#a6da95" fill-opacity="0.9"/>

    <!-- Left Letter 'J' crafted with clean geometric curve & Swift/Flutter fluid aesthetic -->
    <path d="M 188 168
             L 188 286
             C 188 334, 156 354, 120 354
             C 96 354, 76 342, 68 330
             L 86 304
             C 94 314, 106 322, 122 322
             C 142 322, 156 310, 156 282
             L 156 168
             Z"
          fill="url(#accentGrad)"/>

    <!-- Right Letter 'S' crafted with modern dynamic terminal geometry -->
    <path d="M 396 208
             L 368 226
             C 356 208, 338 198, 314 198
             C 288 198, 272 212, 272 230
             C 272 248, 286 258, 322 268
             C 368 280, 396 298, 396 332
             C 396 372, 360 398, 308 398
             C 270 398, 238 380, 222 352
             L 250 332
             C 264 354, 284 366, 308 366
             C 334 366, 362 354, 362 332
             C 362 312, 348 302, 310 292
             C 266 280, 238 262, 238 230
             C 238 192, 272 166, 314 166
             C 348 166, 376 182, 396 208
             Z"
          fill="#cad3f5"/>

    <!-- Mobile Sparkle / Precision Indicator on top-right of S -->
    <circle cx="396" cy="168" r="7" fill="#8bd5ca"/>
    <circle cx="396" cy="168" r="14" fill="#8bd5ca" fill-opacity="0.25"/>

    <!-- Subtle Swift/Flutter Accent Curve Bar below -->
    <rect x="180" y="420" width="144" height="6" rx="3" fill="url(#accentGrad)" opacity="0.8"/>
  </g>
</svg>